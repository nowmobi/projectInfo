<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="A preferred platform for hot news, in-depth analysis and industry trends"
    />
    <title>Article Detail</title>
    <link rel="stylesheet" href="public/style/inpublic.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-content">
        <a href="index.html" class="back-button-header" id="smartBackButton">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M19 12H5M12 19L5 12L12 5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Back</span>
        </a>

        <button class="sidebar-toggle" id="sidebarToggle">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M3 12H21M3 6H21M3 18H21"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </header>

    <div class="ads">
      <div id="div-gpt-ad-detail1"></div>
    </div>

    <main class="page-content">
      <div class="detail-page-content">
        <div class="article-detail">
          <div class="article-header">
            <h1 class="article-detail-title" id="articleTitle">Loading...</h1>
            <div class="article-detail-meta">
              <div class="article-meta-top">
                <span id="articleAuthor">-</span>
                <span id="articleTime">-</span>
              </div>
              <div class="article-meta-bottom">
                <span id="articleSource">-</span>
              </div>
            </div>
          </div>

          <div class="article-detail-content" id="articleContent">
            <div class="loading">
              <div class="loading-spinner"></div>
            </div>
            <div class="article-item"></div>

            <div class="ads">
              <div id="div-gpt-ad-detail2"></div>
            </div>
            <div class="article-item"></div>
            <div class="ads">
              <div id="div-gpt-ad-detail3"></div>
            </div>
            <div class="article-item"></div>
            <div class="ads">
              <div id="div-gpt-ad-detail4"></div>
            </div>
            <div class="article-item"></div>
            <div class="ads">
              <div id="div-gpt-ad-detail5"></div>
            </div>
            <div class="article-item"></div>
          </div>

          <div class="recommended-section">
            <div class="recommended-articles" id="recommendedArticles"></div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-links">
          <a href="pages/about.html">About Us</a>
          <a href="pages/privacy.html">Privacy Policy</a>
        </div>
        <div class="footer-copyright">
          Copyright © 2026 dameizhijin.com. All rights reserved.
        </div>
      </div>
    </footer>

    <div class="sidebar-menu" id="sidebarMenu">
      <div class="sidebar-content">
        <div class="sidebar-header">
          <h3>Menu</h3>
          <button class="sidebar-close" id="sidebarClose">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M18 6L6 18M6 6L18 18"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
        <div class="sidebar-items">
          <a
            href="index.html?fromDetail=true"
            class="sidebar-item"
            data-page="home"
          >
            <span>Home</span>
          </a>

          <div class="sidebar-category"></div>
        </div>
      </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script type="module" src="public/js/inpublic.js"></script>
    <script type="module" src="public/js/detail.js"></script>
    <script type="module">
      import { loadAdsScript } from './public/js/ad_loader_logic.js';
    loadAdsScript('detail');
    </script>
  </body>
</html>
